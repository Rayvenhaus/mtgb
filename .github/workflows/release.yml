name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.6.2-beta'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Installer Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $version = "${{ inputs.version }}".Trim()
              $tag = if ($version.StartsWith("v")) { $version } else { "v$version" }
          } else {
              $tag = "${{ github.ref_name }}"
          }

          $version = $tag.TrimStart('v')
          $installerVersion = $version -replace '-.*$', ''
          $isPrerelease = $version.Contains('-')

          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') {
              throw "Release tag '$tag' is invalid. Expected format: v0.6.2 or v0.6.2-beta."
          }

          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "INSTALLER_VERSION=$installerVersion" >> $env:GITHUB_OUTPUT
          echo "IS_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "Tag:               $tag"
          Write-Host "Display version:   $version"
          Write-Host "Installer version: $installerVersion"
          Write-Host "Prerelease:        $isPrerelease"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build setup
        shell: pwsh
        run: |
          .\build-installer.ps1 `
            -Version "${{ steps.version.outputs.VERSION }}" `
            -Clean

      - name: Extract changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $content = Get-Content "changelog.md" -Raw
          $pattern = "(?m)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)"
          $match = [regex]::Match(
              $content,
              $pattern,
              [System.Text.RegularExpressions.RegexOptions]::Singleline)

          if ($match.Success) {
              $notes = $match.Value.Trim()
          } else {
              $notes = "Release $version"
          }

          $notes | Out-File -FilePath "release_notes.txt" -Encoding UTF8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: "MTGB ${{ steps.version.outputs.TAG }}"
          body_path: release_notes.txt
          draft: true
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
          fail_on_unmatched_files: true
          files: |
            dist/MTGB-v${{ steps.version.outputs.VERSION }}-x64-Setup.exe
            dist/MTGB-v${{ steps.version.outputs.VERSION }}-x64.msi

      - name: Publish community release metadata
        shell: pwsh
        env:
          RELEASE_PUBLISH_URL: ${{ secrets.RELEASE_PUBLISH_URL }}
          COMMUNITY_PUBLISH_KEY: ${{ secrets.COMMUNITY_PUBLISH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_PUBLISH_URL) -or
              [string]::IsNullOrWhiteSpace($env:COMMUNITY_PUBLISH_KEY)) {
              Write-Host "Release publish secrets not configured. Skipping community publish step."
              exit 0
          }

          $tag = "${{ steps.version.outputs.TAG }}"
          $displayVersion = "${{ steps.version.outputs.VERSION }}"
          $installerVersion = "${{ steps.version.outputs.INSTALLER_VERSION }}"
          $isPrerelease = "${{ steps.version.outputs.IS_PRERELEASE }}" -eq "true"
          $repoUrl = "${{ github.server_url }}/${{ github.repository }}"

          $setupUrl = "$repoUrl/releases/download/$tag/MTGB-v$displayVersion-x64-Setup.exe"
          $releasePageUrl = "$repoUrl/releases/tag/$tag"
          $releaseNotes = Get-Content "release_notes.txt" -Raw

          $body = @{
              version = $installerVersion
              release_date = [DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss")
              setup_url = $setupUrl
              release_page_url = $releasePageUrl
              release_notes = $releaseNotes
              is_beta = $isPrerelease
          } | ConvertTo-Json -Depth 4

          Write-Host "Publishing release metadata to $env:RELEASE_PUBLISH_URL"
          Write-Host "Version:      $installerVersion"
          Write-Host "Setup URL:    $setupUrl"
          Write-Host "Release page: $releasePageUrl"
          Write-Host "Prerelease:   $isPrerelease"

          $response = Invoke-RestMethod `
              -Uri $env:RELEASE_PUBLISH_URL `
              -Method Post `
              -Headers @{ "X-Publish-Key" = $env:COMMUNITY_PUBLISH_KEY } `
              -ContentType "application/json" `
              -Body $body

          if (-not $response.status) {
              throw "Community publish endpoint returned status=false."
          }

          Write-Host "Community release metadata published successfully."
